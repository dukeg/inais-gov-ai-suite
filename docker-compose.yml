services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inais
      POSTGRES_USER: inais
      POSTGRES_PASSWORD: inais
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./services/api
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [postgres, redis]
  ai-orchestrator:
    build: ./services/ai-orchestrator
    env_file: .env
    ports: ["4100:4100"]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
